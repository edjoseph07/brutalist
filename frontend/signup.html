<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brutalist Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- Header -->
            <div class="login-header">

                <div class="logo">
                    <div class="logo-square"></div>
                </div>

                <h2>Sign Up</h2>
                <p>Create your account</p>

            </div>


            <!-- Signup Form -->
            <form class="login-form" id="signupForm" novalidate>

                <!-- Name -->
                <div class="form-group">

                    <label for="name" class="form-label">
                        Name
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="text"
                            id="name"
                            name="name"
                            required
                            maxlength="100"
                            autocomplete="name"
                        >

                    </div>

                    <span
                        class="error-message"
                        id="nameError">
                    </span>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email" class="form-label">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            maxlength="254"
                            autocomplete="email"
                        >

                    </div>

                    <span
                        class="error-message"
                        id="emailError">
                    </span>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="input-wrapper password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            minlength="8"
                            maxlength="128"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Toggle password visibility">

                            <span class="toggle-text">
                                SHOW
                            </span>

                        </button>

                    </div>

                    <span
                        class="error-message"
                        id="passwordError">
                    </span>

                </div>


                <!-- Signup Button -->
                <button
                    type="submit"
                    class="login-btn">

                    <span class="btn-text">
                        SIGN UP
                    </span>

                    <div class="btn-loader">
                        <div class="loader-bar"></div>
                        <div class="loader-bar"></div>
                        <div class="loader-bar"></div>
                    </div>

                </button>

            </form>


            <!-- Message -->
            <div
                id="message"
                class="form-message">
            </div>


            <!-- Login Link -->
            <div class="signup-link">

                <span>Already have an account? </span>

                <a href="index.html">
                    Sign In
                </a>

            </div>


            <!-- Success Message -->
            <div
                class="success-message"
                id="successMessage">

                <div class="success-icon">✓</div>

                <h3>Success</h3>

                <p>Redirecting...</p>

            </div>

        </div>

    </div>

    <script src="signup.js"></script>

</body>
</html>
